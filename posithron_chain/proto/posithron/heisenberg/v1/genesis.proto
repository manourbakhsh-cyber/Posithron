syntax = "proto3";
package posithron.heisenberg.v1;

import "amino/amino.proto";
import "gogoproto/gogo.proto";
import "posithron/heisenberg/v1/params.proto";

option go_package = "posithron/x/heisenberg/types";

// GenesisState defines the heisenberg module's genesis state.
message GenesisState {
  // params defines all the parameters of the module.
  Params params = 1 [
    (gogoproto.nullable) = false,
    (amino.dont_omitempty) = true
  ];
}
