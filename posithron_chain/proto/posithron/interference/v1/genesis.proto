syntax = "proto3";
package posithron.interference.v1;

import "amino/amino.proto";
import "gogoproto/gogo.proto";
import "posithron/interference/v1/params.proto";

option go_package = "posithron/x/interference/types";

// GenesisState defines the interference module's genesis state.
message GenesisState {
  // params defines all the parameters of the module.
  Params params = 1 [
    (gogoproto.nullable) = false,
    (amino.dont_omitempty) = true
  ];
}
