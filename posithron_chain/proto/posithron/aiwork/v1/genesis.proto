syntax = "proto3";
package posithron.aiwork.v1;

import "amino/amino.proto";
import "gogoproto/gogo.proto";
import "posithron/aiwork/v1/params.proto";

option go_package = "posithron/x/aiwork/types";

// GenesisState defines the aiwork module's genesis state.
message GenesisState {
  // params defines all the parameters of the module.
  Params params = 1 [
    (gogoproto.nullable) = false,
    (amino.dont_omitempty) = true
  ];
}
