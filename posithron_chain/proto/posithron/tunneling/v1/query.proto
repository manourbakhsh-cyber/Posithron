syntax = "proto3";

package posithron.tunneling.v1;

import "amino/amino.proto";
import "cosmos/base/query/v1beta1/pagination.proto";
import "gogoproto/gogo.proto";
import "google/api/annotations.proto";
import "posithron/tunneling/v1/params.proto";
import "posithron/tunneling/v1/trust_record.proto";

option go_package = "posithron/x/tunneling/types";

// Query defines the gRPC querier service.
service Query {
  // Parameters queries the parameters of the module.
  rpc Params(QueryParamsRequest) returns (QueryParamsResponse) {
    option (google.api.http).get = "/posithron/tunneling/v1/params";
  }

  // ListTrustRecord Queries a list of TrustRecord items.
  rpc GetTrustRecord(QueryGetTrustRecordRequest) returns (QueryGetTrustRecordResponse) {
    option (google.api.http).get = "/posithron/tunneling/v1/trust_record/{index}";
  }

  // ListTrustRecord defines the ListTrustRecord RPC.
  rpc ListTrustRecord(QueryAllTrustRecordRequest) returns (QueryAllTrustRecordResponse) {
    option (google.api.http).get = "/posithron/tunneling/v1/trust_record";
  }
}
// QueryParamsRequest is request type for the Query/Params RPC method.
message QueryParamsRequest {}

// QueryParamsResponse is response type for the Query/Params RPC method.
message QueryParamsResponse {
  // params holds all the parameters of this module.
  Params params = 1 [
    (gogoproto.nullable) = false,
    (amino.dont_omitempty) = true
  ];
}

// QueryGetTrustRecordRequest defines the QueryGetTrustRecordRequest message.
message QueryGetTrustRecordRequest {
  string index = 1;
}

// QueryGetTrustRecordResponse defines the QueryGetTrustRecordResponse message.
message QueryGetTrustRecordResponse {
  TrustRecord trust_record = 1 [(gogoproto.nullable) = false];
}

// QueryAllTrustRecordRequest defines the QueryAllTrustRecordRequest message.
message QueryAllTrustRecordRequest {
  cosmos.base.query.v1beta1.PageRequest pagination = 1;
}

// QueryAllTrustRecordResponse defines the QueryAllTrustRecordResponse message.
message QueryAllTrustRecordResponse {
  repeated TrustRecord trust_record = 1 [(gogoproto.nullable) = false];
  cosmos.base.query.v1beta1.PageResponse pagination = 2;
}
