syntax = "proto3";

package posithron.tunneling.v1;

import "amino/amino.proto";
import "cosmos/msg/v1/msg.proto";
import "cosmos_proto/cosmos.proto";
import "gogoproto/gogo.proto";
import "posithron/tunneling/v1/params.proto";

option go_package = "posithron/x/tunneling/types";

// Msg defines the Msg service.
service Msg {
  option (cosmos.msg.v1.service) = true;

  // UpdateParams defines a (governance) operation for updating the module
  // parameters. The authority defaults to the x/gov module account.
  rpc UpdateParams(MsgUpdateParams) returns (MsgUpdateParamsResponse);

  // CheckTunnel defines the CheckTunnel RPC.
  rpc CheckTunnel(MsgCheckTunnel) returns (MsgCheckTunnelResponse);

  // CreateTrustRecord defines the CreateTrustRecord RPC.
  rpc CreateTrustRecord(MsgCreateTrustRecord) returns (MsgCreateTrustRecordResponse);

  // UpdateTrustRecord defines the UpdateTrustRecord RPC.
  rpc UpdateTrustRecord(MsgUpdateTrustRecord) returns (MsgUpdateTrustRecordResponse);

  // DeleteTrustRecord defines the DeleteTrustRecord RPC.
  rpc DeleteTrustRecord(MsgDeleteTrustRecord) returns (MsgDeleteTrustRecordResponse);
}
// MsgUpdateParams is the Msg/UpdateParams request type.
message MsgUpdateParams {
  option (cosmos.msg.v1.signer) = "authority";
  option (amino.name) = "posithron/x/tunneling/MsgUpdateParams";

  // authority is the address that controls the module (defaults to x/gov unless overwritten).
  string authority = 1 [(cosmos_proto.scalar) = "cosmos.AddressString"];

  // params defines the module parameters to update.

  // NOTE: All parameters must be supplied.
  Params params = 2 [
    (gogoproto.nullable) = false,
    (amino.dont_omitempty) = true
  ];
}

// MsgUpdateParamsResponse defines the response structure for executing a
// MsgUpdateParams message.
message MsgUpdateParamsResponse {}

// MsgCheckTunnel defines the MsgCheckTunnel message.
message MsgCheckTunnel {
  option (cosmos.msg.v1.signer) = "creator";
  string creator = 1 [(cosmos_proto.scalar) = "cosmos.AddressString"];
  int64 trust_score = 2;
  int64 required_score = 3;
}

// MsgCheckTunnelResponse defines the MsgCheckTunnelResponse message.
message MsgCheckTunnelResponse {}

// MsgCreateTrustRecord defines the MsgCreateTrustRecord message.
message MsgCreateTrustRecord {
  option (cosmos.msg.v1.signer) = "creator";
  string creator = 1 [(cosmos_proto.scalar) = "cosmos.AddressString"];
  string index = 2;
  int64 score = 3;
}

// MsgCreateTrustRecordResponse defines the MsgCreateTrustRecordResponse message.
message MsgCreateTrustRecordResponse {}

// MsgUpdateTrustRecord defines the MsgUpdateTrustRecord message.
message MsgUpdateTrustRecord {
  option (cosmos.msg.v1.signer) = "creator";
  string creator = 1 [(cosmos_proto.scalar) = "cosmos.AddressString"];
  string index = 2;
  int64 score = 3;
}

// MsgUpdateTrustRecordResponse defines the MsgUpdateTrustRecordResponse message.
message MsgUpdateTrustRecordResponse {}

// MsgDeleteTrustRecord defines the MsgDeleteTrustRecord message.
message MsgDeleteTrustRecord {
  option (cosmos.msg.v1.signer) = "creator";
  string creator = 1 [(cosmos_proto.scalar) = "cosmos.AddressString"];
  string index = 2;
}

// MsgDeleteTrustRecordResponse defines the MsgDeleteTrustRecordResponse message.
message MsgDeleteTrustRecordResponse {}
