syntax = "proto3";

package posithron.hawking.v1;

import "amino/amino.proto";
import "cosmos/msg/v1/msg.proto";
import "cosmos_proto/cosmos.proto";
import "gogoproto/gogo.proto";
import "posithron/hawking/v1/params.proto";

option go_package = "posithron/x/hawking/types";

// Msg defines the Msg service.
service Msg {
  option (cosmos.msg.v1.service) = true;

  // UpdateParams defines a (governance) operation for updating the module
  // parameters. The authority defaults to the x/gov module account.
  rpc UpdateParams(MsgUpdateParams) returns (MsgUpdateParamsResponse);

  // CreateNodeRecord defines the CreateNodeRecord RPC.
  rpc CreateNodeRecord(MsgCreateNodeRecord) returns (MsgCreateNodeRecordResponse);

  // UpdateNodeRecord defines the UpdateNodeRecord RPC.
  rpc UpdateNodeRecord(MsgUpdateNodeRecord) returns (MsgUpdateNodeRecordResponse);

  // DeleteNodeRecord defines the DeleteNodeRecord RPC.
  rpc DeleteNodeRecord(MsgDeleteNodeRecord) returns (MsgDeleteNodeRecordResponse);

  // EvaporateStake defines the EvaporateStake RPC.
  rpc EvaporateStake(MsgEvaporateStake) returns (MsgEvaporateStakeResponse);
}
// MsgUpdateParams is the Msg/UpdateParams request type.
message MsgUpdateParams {
  option (cosmos.msg.v1.signer) = "authority";
  option (amino.name) = "posithron/x/hawking/MsgUpdateParams";

  // authority is the address that controls the module (defaults to x/gov unless overwritten).
  string authority = 1 [(cosmos_proto.scalar) = "cosmos.AddressString"];

  // params defines the module parameters to update.

  // NOTE: All parameters must be supplied.
  Params params = 2 [
    (gogoproto.nullable) = false,
    (amino.dont_omitempty) = true
  ];
}

// MsgUpdateParamsResponse defines the response structure for executing a
// MsgUpdateParams message.
message MsgUpdateParamsResponse {}

// MsgCreateNodeRecord defines the MsgCreateNodeRecord message.
message MsgCreateNodeRecord {
  option (cosmos.msg.v1.signer) = "creator";
  string creator = 1 [(cosmos_proto.scalar) = "cosmos.AddressString"];
  string index = 2;
  int64 stake_amount = 3;
}

// MsgCreateNodeRecordResponse defines the MsgCreateNodeRecordResponse message.
message MsgCreateNodeRecordResponse {}

// MsgUpdateNodeRecord defines the MsgUpdateNodeRecord message.
message MsgUpdateNodeRecord {
  option (cosmos.msg.v1.signer) = "creator";
  string creator = 1 [(cosmos_proto.scalar) = "cosmos.AddressString"];
  string index = 2;
  int64 stake_amount = 3;
}

// MsgUpdateNodeRecordResponse defines the MsgUpdateNodeRecordResponse message.
message MsgUpdateNodeRecordResponse {}

// MsgDeleteNodeRecord defines the MsgDeleteNodeRecord message.
message MsgDeleteNodeRecord {
  option (cosmos.msg.v1.signer) = "creator";
  string creator = 1 [(cosmos_proto.scalar) = "cosmos.AddressString"];
  string index = 2;
}

// MsgDeleteNodeRecordResponse defines the MsgDeleteNodeRecordResponse message.
message MsgDeleteNodeRecordResponse {}

// MsgEvaporateStake defines the MsgEvaporateStake message.
message MsgEvaporateStake {
  option (cosmos.msg.v1.signer) = "creator";
  string creator = 1 [(cosmos_proto.scalar) = "cosmos.AddressString"];
  string node_address = 2;
  int64 network_total_stake = 3;
}

// MsgEvaporateStakeResponse defines the MsgEvaporateStakeResponse message.
message MsgEvaporateStakeResponse {}
