syntax = "proto3";

package posithron.casimir.v1;

import "amino/amino.proto";
import "gogoproto/gogo.proto";
import "posithron/casimir/v1/params.proto";
import "posithron/casimir/v1/presence_record.proto";

option go_package = "posithron/x/casimir/types";

// GenesisState defines the casimir module's genesis state.
message GenesisState {
  // params defines all the parameters of the module.
  Params params = 1 [
    (gogoproto.nullable) = false,
    (amino.dont_omitempty) = true
  ];
  repeated PresenceRecord presence_record_map = 2 [(gogoproto.nullable) = false];
}
