syntax = "proto3";
package posithron.cognition.v1;

import "cosmos/base/v1beta1/coin.proto";
import "gogoproto/gogo.proto";

option go_package = "posithron/x/cognition/types";

// TaskRecord defines the TaskRecord message.
message TaskRecord {
  string index = 1;
  string prompt = 2;
  repeated cosmos.base.v1beta1.Coin bounty = 3 [(gogoproto.nullable) = false];
  string status = 4;
  string creator = 5;
}
