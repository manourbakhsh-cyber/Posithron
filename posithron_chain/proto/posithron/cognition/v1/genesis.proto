syntax = "proto3";

package posithron.cognition.v1;

import "amino/amino.proto";
import "gogoproto/gogo.proto";
import "posithron/cognition/v1/params.proto";
import "posithron/cognition/v1/task_record.proto";

option go_package = "posithron/x/cognition/types";

// GenesisState defines the cognition module's genesis state.
message GenesisState {
  // params defines all the parameters of the module.
  Params params = 1 [
    (gogoproto.nullable) = false,
    (amino.dont_omitempty) = true
  ];
  repeated TaskRecord task_record_map = 2 [(gogoproto.nullable) = false];
}
