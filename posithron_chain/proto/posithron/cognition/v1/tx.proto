syntax = "proto3";

package posithron.cognition.v1;

import "amino/amino.proto";
import "cosmos/base/v1beta1/coin.proto";
import "cosmos/msg/v1/msg.proto";
import "cosmos_proto/cosmos.proto";
import "gogoproto/gogo.proto";
import "posithron/cognition/v1/params.proto";

option go_package = "posithron/x/cognition/types";

// Msg defines the Msg service.
service Msg {
  option (cosmos.msg.v1.service) = true;

  // UpdateParams defines a (governance) operation for updating the module
  // parameters. The authority defaults to the x/gov module account.
  rpc UpdateParams(MsgUpdateParams) returns (MsgUpdateParamsResponse);

  // CreateTask defines the CreateTask RPC.
  rpc CreateTask(MsgCreateTask) returns (MsgCreateTaskResponse);

  // CreateTaskRecord defines the CreateTaskRecord RPC.
  rpc CreateTaskRecord(MsgCreateTaskRecord) returns (MsgCreateTaskRecordResponse);

  // UpdateTaskRecord defines the UpdateTaskRecord RPC.
  rpc UpdateTaskRecord(MsgUpdateTaskRecord) returns (MsgUpdateTaskRecordResponse);

  // DeleteTaskRecord defines the DeleteTaskRecord RPC.
  rpc DeleteTaskRecord(MsgDeleteTaskRecord) returns (MsgDeleteTaskRecordResponse);
}
// MsgUpdateParams is the Msg/UpdateParams request type.
message MsgUpdateParams {
  option (cosmos.msg.v1.signer) = "authority";
  option (amino.name) = "posithron/x/cognition/MsgUpdateParams";

  // authority is the address that controls the module (defaults to x/gov unless overwritten).
  string authority = 1 [(cosmos_proto.scalar) = "cosmos.AddressString"];

  // params defines the module parameters to update.

  // NOTE: All parameters must be supplied.
  Params params = 2 [
    (gogoproto.nullable) = false,
    (amino.dont_omitempty) = true
  ];
}

// MsgUpdateParamsResponse defines the response structure for executing a
// MsgUpdateParams message.
message MsgUpdateParamsResponse {}

// MsgCreateTask defines the MsgCreateTask message.
message MsgCreateTask {
  option (cosmos.msg.v1.signer) = "creator";
  string creator = 1 [(cosmos_proto.scalar) = "cosmos.AddressString"];
  string prompt = 2;
  repeated cosmos.base.v1beta1.Coin bounty = 3 [(gogoproto.nullable) = false];
}

// MsgCreateTaskResponse defines the MsgCreateTaskResponse message.
message MsgCreateTaskResponse {}

// MsgCreateTaskRecord defines the MsgCreateTaskRecord message.
message MsgCreateTaskRecord {
  option (cosmos.msg.v1.signer) = "creator";
  string creator = 1 [(cosmos_proto.scalar) = "cosmos.AddressString"];
  string index = 2;
  string prompt = 3;
  repeated cosmos.base.v1beta1.Coin bounty = 4 [(gogoproto.nullable) = false];
  string status = 5;
}

// MsgCreateTaskRecordResponse defines the MsgCreateTaskRecordResponse message.
message MsgCreateTaskRecordResponse {}

// MsgUpdateTaskRecord defines the MsgUpdateTaskRecord message.
message MsgUpdateTaskRecord {
  option (cosmos.msg.v1.signer) = "creator";
  string creator = 1 [(cosmos_proto.scalar) = "cosmos.AddressString"];
  string index = 2;
  string prompt = 3;
  repeated cosmos.base.v1beta1.Coin bounty = 4 [(gogoproto.nullable) = false];
  string status = 5;
}

// MsgUpdateTaskRecordResponse defines the MsgUpdateTaskRecordResponse message.
message MsgUpdateTaskRecordResponse {}

// MsgDeleteTaskRecord defines the MsgDeleteTaskRecord message.
message MsgDeleteTaskRecord {
  option (cosmos.msg.v1.signer) = "creator";
  string creator = 1 [(cosmos_proto.scalar) = "cosmos.AddressString"];
  string index = 2;
}

// MsgDeleteTaskRecordResponse defines the MsgDeleteTaskRecordResponse message.
message MsgDeleteTaskRecordResponse {}
